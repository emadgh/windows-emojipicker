name: Shared updater validation

on:
  push:
    branches: [refactor/shared-github-updater]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup default stable
      - name: Check
        run: cargo check
      - name: Build release
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-emojipicker-shared-updater-test
          path: target/release/windows-emojipicker.exe
          if-no-files-found: error
          retention-days: 30
