[package]
name = "windows-emojipicker"
version = "0.3.8"
edition = "2021"
rust-version = "1.85"
description = "A lightweight native Windows emoji, kaomoji, ASCII art and snippet picker"
license = "MIT"
repository = "https://github.com/emadgh/windows-emojipicker"

[dependencies]
emojis = "=0.9.0"
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.140"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "=3.0.11"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
